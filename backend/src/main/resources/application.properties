# spring.application.name=api

# ── Application ──────────────────────────────────────────────
spring.application.name=subscription-tracker

# ── H2 File-Mode Database ────────────────────────────────────
# Stores the DB as a file so data survives app restarts
spring.datasource.url=jdbc:h2:file:./data/subscriptiondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update = creates tables if missing, alters if schema changed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Web Console ───────────────────────────────────────────
# Lets you browse the DB at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Server ───────────────────────────────────────────────────
server.port=8080

