# ── Application ──────────────────────────────────────────────
spring.application.name=subscription-tracker

# ── H2 File-Mode Database ────────────────────────────────────
# Stores the DB as a file so data survives app restarts
spring.datasource.url=jdbc:h2:file:./data/subscriptiondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Web Console ───────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Server ───────────────────────────────────────────────────
server.port=8080

# ── Email (Gmail SMTP) ───────────────────────────────────────
# Real credentials come from environment variables — never commit real values here
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:not-configured}
spring.mail.password=${GMAIL_APP_PASSWORD:not-configured}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Scheduling ───────────────────────────────────────────────
spring.task.scheduling.pool.size=1

# ── App Config ───────────────────────────────────────────────
app.base-url=http://localhost:8080
app.reminder.email=dvsr2005@gmail.com

# ── Plaid (Sandbox) ───────────────────────────────────────────
# Real credentials come from environment variables — never commit real values here
plaid.client-id=${PLAID_CLIENT_ID:not-configured}
plaid.secret=${PLAID_SECRET:not-configured}
plaid.env=sandbox
